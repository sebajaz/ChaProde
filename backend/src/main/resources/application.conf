ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ com.chaprode.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5433/chaprode_db"
    jdbcUrl = ${?DB_JDBC_URL}
    driverClassName = "org.postgresql.Driver"
    user = "postgres"
    user = ${?DB_USER}
    password = "prodepw"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
}

jwt {
    secret = "chaprode_super_secret_jwt_key_2026_very_long_and_safe_token"
    secret = ${?JWT_SECRET}
    issuer = "http://0.0.0.0:8080/"
    audience = "chaprode_users"
    realm = "ChaProde App"
    expirationHours = 72
}

footballApi {
    token = ""
    token = ${?FOOTBALL_API_TOKEN}
    baseUrl = "https://api.football-data.org/v4"
    baseUrl = ${?FOOTBALL_API_BASE_URL}
    syncIntervalMinutes = 15
    syncIntervalMinutes = ${?FOOTBALL_API_SYNC_INTERVAL}
    autoSyncEnabled = true
    autoSyncEnabled = ${?FOOTBALL_API_AUTO_SYNC}
}
